<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Remote Ninja</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/auth/auth-styles.css">
</head>
<body>

<a href="/" class="auth-logo">
  <div class="icon">SL</div>
  <div class="name">Remote <span>Ninja</span></div>
</a>

<div class="auth-card">
  <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a>

  <!-- Step 1: Request code -->
  <div id="step-email">
    <h1><i class="fa-solid fa-key" style="color:var(--warning);font-size:18px;margin-right:4px"></i> Reset Password</h1>
    <p class="subtitle">Enter your email and we'll send you a code to reset your password.</p>
    <div id="alert-box-1"></div>
    <form onsubmit="return requestCode(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@amazon.com" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" id="request-btn">
        <span id="request-text">Send Reset Code</span>
        <span id="request-spinner" style="display:none"><span class="spinner"></span></span>
      </button>
    </form>
  </div>

  <!-- Step 2: Enter code + new password -->
  <div id="step-reset" style="display:none">
    <h1><i class="fa-solid fa-lock-open" style="color:var(--success);font-size:18px;margin-right:4px"></i> New Password</h1>
    <p class="subtitle" id="reset-subtitle">Enter the code sent to your email and choose a new password.</p>
    <div id="alert-box-2"></div>
    <form onsubmit="return resetPassword(event)">
      <div class="form-group">
        <label for="code">Verification Code</label>
        <input type="text" id="code" placeholder="6-digit code" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric">
      </div>
      <div class="form-group">
        <label for="new-pw">New Password</label>
        <input type="password" id="new-pw" placeholder="Min 8 chars, upper+lower+number" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm-pw">Confirm New Password</label>
        <input type="password" id="confirm-pw" placeholder="Re-enter new password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="reset-btn">
        <span id="reset-text">Reset Password</span>
        <span id="reset-spinner" style="display:none"><span class="spinner"></span></span>
      </button>
    </form>
    <div style="text-align:center;margin-top:12px">
      <button onclick="requestCode(null)" style="background:none;border:none;color:var(--text-link);font-size:12px;cursor:pointer;font-weight:600">Resend Code</button>
    </div>
  </div>

  <div class="link-row">
    Remember your password? <a href="/">Sign in</a>
  </div>
</div>

<script src="/auth/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
<script>

var savedEmail = '';

function showAlert(boxId, msg, type) {
  document.getElementById(boxId).innerHTML = '<div class="alert alert-' + type + '"><i class="fa-solid fa-' + (type === 'success' ? 'check-circle' : 'circle-exclamation') + '"></i>' + msg + '</div>';
}

function requestCode(e) {
  if (e) e.preventDefault();
  savedEmail = document.getElementById('email').value.trim();
  if (!savedEmail) { showAlert('alert-box-1', 'Please enter your email.', 'error'); return false; }

  document.getElementById('request-text').style.display = 'none';
  document.getElementById('request-spinner').style.display = '';
  document.getElementById('request-btn').disabled = true;
  document.getElementById('alert-box-1').innerHTML = '';

  var poolData = { UserPoolId: AUTH_CONFIG.UserPoolId, ClientId: AUTH_CONFIG.ClientId };
  var userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
  var cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: savedEmail, Pool: userPool });

  cognitoUser.forgotPassword({
    onSuccess: function() {
      document.getElementById('step-email').style.display = 'none';
      document.getElementById('step-reset').style.display = '';
      document.getElementById('reset-subtitle').textContent = 'Enter the code sent to ' + savedEmail + ' and choose a new password.';
    },
    onFailure: function(err) {
      document.getElementById('request-text').style.display = '';
      document.getElementById('request-spinner').style.display = 'none';
      document.getElementById('request-btn').disabled = false;
      var msg = err.message || 'Failed to send code.';
      if (err.code === 'UserNotFoundException') msg = 'No account found with this email.';
      if (err.code === 'LimitExceededException') msg = 'Too many attempts. Please try again later.';
      showAlert('alert-box-1', msg, 'error');
    }
  });

  return false;
}

function resetPassword(e) {
  e.preventDefault();
  var code = document.getElementById('code').value.trim();
  var newPw = document.getElementById('new-pw').value;
  var confirmPw = document.getElementById('confirm-pw').value;

  if (!code || !newPw) { showAlert('alert-box-2', 'Please fill in all fields.', 'error'); return false; }
  if (newPw !== confirmPw) { showAlert('alert-box-2', 'Passwords do not match.', 'error'); return false; }
  if (newPw.length < 8) { showAlert('alert-box-2', 'Password must be at least 8 characters.', 'error'); return false; }

  document.getElementById('reset-text').style.display = 'none';
  document.getElementById('reset-spinner').style.display = '';
  document.getElementById('reset-btn').disabled = true;
  document.getElementById('alert-box-2').innerHTML = '';

  var poolData = { UserPoolId: AUTH_CONFIG.UserPoolId, ClientId: AUTH_CONFIG.ClientId };
  var userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
  var cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: savedEmail, Pool: userPool });

  cognitoUser.confirmPassword(code, newPw, {
    onSuccess: function() {
      window.location.href = '/?reset=1';
    },
    onFailure: function(err) {
      document.getElementById('reset-text').style.display = '';
      document.getElementById('reset-spinner').style.display = 'none';
      document.getElementById('reset-btn').disabled = false;
      var msg = err.message || 'Reset failed.';
      if (err.code === 'CodeMismatchException') msg = 'Invalid code. Please check and try again.';
      if (err.code === 'ExpiredCodeException') msg = 'Code expired. Click "Resend Code" below.';
      showAlert('alert-box-2', msg, 'error');
    }
  });

  return false;
}
</script>
</body>
</html>
