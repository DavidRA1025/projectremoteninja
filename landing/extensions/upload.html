<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extension Manager — Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/auth/theme.css">
<script src="/auth/theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg-primary);color:var(--text-primary);padding:32px 20px}
a{text-decoration:none;color:var(--text-link)}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:13px;font-weight:600;transition:color .2s}
.back:hover{color:var(--text-link)}
.page-title{font-size:24px;font-weight:800;margin-bottom:24px;display:flex;align-items:center;gap:10px;color:var(--text-heading)}
.page-title i{color:var(--warning)}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--text-link)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}
.btn-danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}.btn-danger:hover{opacity:.9}
.btn-sm{padding:5px 10px;font-size:11px}

/* Extension list */
.ext-list{display:flex;flex-direction:column;gap:12px;max-width:900px}
.ext-item{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px;transition:all .15s;box-shadow:var(--shadow-sm)}
.ext-item:hover{border-color:var(--border-strong)}
.ext-item-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.ext-item-info{flex:1;min-width:0}
.ext-item-info h4{font-size:14px;font-weight:700}
.ext-item-info .meta{font-size:11px;color:var(--text-tertiary)}
.ext-item-actions{display:flex;gap:6px;flex-shrink:0}

.empty{text-align:center;padding:40px;color:var(--text-tertiary);font-size:14px}

/* Form modal */
.modal-bg{position:fixed;inset:0;background:var(--bg-overlay);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:28px;width:600px;max-width:100%;box-shadow:var(--shadow-lg)}
.modal h3{font-size:18px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px;color:var(--text-heading)}
.modal h3 i{color:var(--accent)}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:80px;resize:vertical}
.field .hint{font-size:10px;color:var(--text-tertiary);margin-top:2px}

.row{display:flex;gap:12px}
.row .field{flex:1}

/* Color picker */
.color-row{display:flex;gap:6px;align-items:center}
.color-swatch{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-swatch:hover,.color-swatch.sel{border-color:var(--text-primary);transform:scale(1.1)}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--toggle-track);cursor:pointer;position:relative;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--toggle-knob);transition:left .2s}
.toggle.on::after{left:18px}

/* Upload area */
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:8px}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:var(--accent-bg)}
.upload-area i{font-size:24px;color:var(--text-tertiary);margin-bottom:8px;display:block}
.upload-area .label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.upload-area .sublabel{font-size:10px;color:var(--text-tertiary);margin-top:4px}
.upload-status{font-size:11px;padding:6px 10px;border-radius:6px;margin-top:6px;display:none}
.upload-status.ok{display:block;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}
.upload-status.err{display:block;background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.upload-status.prog{display:block;background:var(--info-bg);color:var(--info);border:1px solid var(--info-border)}

.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;display:none;align-items:center;gap:8px;z-index:200;box-shadow:var(--shadow-lg)}
.toast.ok{display:flex;background:var(--success);color:#fff}
.toast.err{display:flex;background:var(--danger);color:#fff}
</style>
<script src="/auth/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
<script src="/auth/guard.js"></script>
</head>
<body>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <div class="top-bar">
    <a href="/extensions/" class="back"><i class="fa-solid fa-arrow-left"></i> Back to Extensions</a>
    <span id="theme-toggle-slot"></span>
  </div>
  <div class="page-title"><i class="fa-solid fa-screwdriver-wrench"></i> Extension Manager</div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="openForm()"><i class="fa-solid fa-plus"></i> Add Extension</button>
    <button class="btn" onclick="loadExts()"><i class="fa-solid fa-rotate"></i> Refresh</button>
  </div>

  <div class="ext-list" id="ext-list">
    <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
  </div>
</div>

<!-- FORM MODAL -->
<div class="modal-bg" id="form-modal">
  <div class="modal">
    <h3><i class="fa-solid fa-puzzle-piece"></i> <span id="form-title">Add Extension</span></h3>

    <div class="row">
      <div class="field"><label>Extension Name</label><input type="text" id="f-name" placeholder="e.g. Status Manager"></div>
      <div class="field"><label>Version</label><input type="text" id="f-version" placeholder="e.g. 2.9.2"></div>
    </div>

    <div class="field"><label>Description</label><textarea id="f-desc" placeholder="What does this extension do?"></textarea></div>

    <div class="field">
      <label>Features (one per line)</label>
      <textarea id="f-features" placeholder="One-click status sync&#10;Auto-detects active platforms&#10;Works with all tenants"></textarea>
      <div class="hint">Each line becomes a bullet point on the card</div>
    </div>

    <div class="row">
      <div class="field">
        <label>Icon (Font Awesome class)</label>
        <input type="text" id="f-icon" placeholder="fa-solid fa-arrows-rotate" value="fa-solid fa-puzzle-piece">
        <div class="hint">Browse icons at <a href="https://fontawesome.com/icons" target="_blank">fontawesome.com</a></div>
      </div>
      <div class="field">
        <label>Tags (comma-separated)</label>
        <input type="text" id="f-tags" placeholder="AMIGO, Persona, Paragon">
      </div>
    </div>

    <div class="field">
      <label>Card Gradient Colors</label>
      <div class="color-row" id="color-picker"></div>
    </div>

    <div class="field">
      <div class="toggle-row">
        <div class="toggle" id="f-chromeonly" onclick="this.classList.toggle('on')"></div>
        <span>Chrome only (no Firefox version)</span>
      </div>
    </div>

    <!-- File uploads -->
    <div class="row">
      <div class="field">
        <label><i class="fa-brands fa-chrome" style="color:#4285f4"></i> Chrome Build (.zip)</label>
        <div class="upload-area" id="upload-chrome" onclick="document.getElementById('file-chrome').click()">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <div class="label">Drop .zip here or click</div>
          <div class="sublabel">Chrome extension package</div>
          <input type="file" id="file-chrome" accept=".zip" style="display:none" onchange="handleUpload('chrome',this.files[0])">
        </div>
        <div class="upload-status" id="status-chrome"></div>
        <input type="text" id="f-chrome-url" placeholder="Chrome download URL (auto-filled on upload)" style="margin-top:6px;font-size:11px">
      </div>
      <div class="field" id="firefox-upload-field">
        <label><i class="fa-brands fa-firefox-browser" style="color:#ff7f00"></i> Firefox Build (.xpi)</label>
        <div class="upload-area" id="upload-firefox" onclick="document.getElementById('file-firefox').click()">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <div class="label">Drop .xpi here or click</div>
          <div class="sublabel">Firefox extension package</div>
          <input type="file" id="file-firefox" accept=".xpi,.zip" style="display:none" onchange="handleUpload('firefox',this.files[0])">
        </div>
        <div class="upload-status" id="status-firefox"></div>
        <input type="text" id="f-firefox-url" placeholder="Firefox download URL (auto-filled on upload)" style="margin-top:6px;font-size:11px">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeForm()">Cancel</button>
      <button class="btn btn-primary" onclick="saveExt()"><i class="fa-solid fa-check"></i> Save Extension</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i> <span id="toast-msg"></span></div>

<script>
ThemeManager.injectToggle('theme-toggle-slot');

var API_URL = "https://zta7che674.execute-api.us-east-1.amazonaws.com/api";
var editingId = null;

var GRADIENT_PRESETS = [
  ["#6366f1","#8b5cf6"],["#22c55e","#10b981"],["#f59e0b","#f97316"],
  ["#06b6d4","#0ea5e9"],["#ec4899","#f43f5e"],["#ef4444","#dc2626"],
  ["#3b82f6","#2563eb"],["#14b8a6","#0d9488"],["#a855f7","#7c3aed"],
  ["#64748b","#475569"]
];
var selectedGradient = 0;

// Show admin panel immediately (unlisted page, auth guard handles protection)
document.getElementById('admin-panel').style.display = 'block';
loadExts();

function toast(msg, ok) {
  var t = document.getElementById("toast");
  document.getElementById("toast-msg").textContent = msg;
  t.className = "toast " + (ok ? "ok" : "err");
  setTimeout(function() { t.className = "toast"; }, 3000);
}

function loadExts() {
  fetch(API_URL + "/extensions")
    .then(function(r) { return r.json(); })
    .then(function(result) {
      var exts = result.data || [];
      var list = document.getElementById("ext-list");
      if (exts.length === 0) {
        list.innerHTML = '<div class="empty"><i class="fa-solid fa-puzzle-piece" style="font-size:32px;opacity:.3;margin-bottom:8px;display:block"></i>No extensions yet. Click "Add Extension" to create one.</div>';
        return;
      }
      var html = "";
      exts.forEach(function(ext) {
        var c1 = (ext.gradient_colors && ext.gradient_colors[0]) || "#6366f1";
        var c2 = (ext.gradient_colors && ext.gradient_colors[1]) || "#8b5cf6";
        html += '<div class="ext-item">' +
          '<div class="ext-item-icon" style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ')"><i class="' + (ext.icon || "fa-solid fa-puzzle-piece") + '"></i></div>' +
          '<div class="ext-item-info"><h4>' + ext.name + '</h4><div class="meta">v' + ext.version + ' &middot; ' + (ext.tags || []).join(", ") +
          (ext.chrome_url ? ' &middot; <span style="color:#4285f4">Chrome</span>' : '') +
          (ext.firefox_url ? ' &middot; <span style="color:#ff7f00">Firefox</span>' : '') +
          '</div></div>' +
          '<div class="ext-item-actions">' +
            '<button class="btn btn-sm" onclick=\'editExt(' + JSON.stringify(JSON.stringify(ext)) + ')\'><i class="fa-solid fa-pen"></i> Edit</button>' +
            '<button class="btn btn-sm btn-danger" onclick="deleteExt(\'' + ext.id + '\',\'' + ext.name + '\')"><i class="fa-solid fa-trash"></i></button>' +
          '</div></div>';
      });
      list.innerHTML = html;
    })
    .catch(function(err) {
      document.getElementById("ext-list").innerHTML = '<div class="empty">Error loading extensions: ' + err.message + '</div>';
    });
}

function renderColorPicker() {
  var html = "";
  GRADIENT_PRESETS.forEach(function(g, i) {
    html += '<div class="color-swatch' + (i === selectedGradient ? ' sel' : '') + '" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')" onclick="selectGradient(' + i + ')"></div>';
  });
  document.getElementById("color-picker").innerHTML = html;
}
function selectGradient(i) { selectedGradient = i; renderColorPicker(); }

function openForm(ext) {
  editingId = null;
  document.getElementById("form-title").textContent = "Add Extension";
  document.getElementById("f-name").value = "";
  document.getElementById("f-version").value = "";
  document.getElementById("f-desc").value = "";
  document.getElementById("f-features").value = "";
  document.getElementById("f-icon").value = "fa-solid fa-puzzle-piece";
  document.getElementById("f-tags").value = "";
  document.getElementById("f-chrome-url").value = "";
  document.getElementById("f-firefox-url").value = "";
  document.getElementById("f-chromeonly").classList.remove("on");
  document.getElementById("status-chrome").className = "upload-status";
  document.getElementById("status-firefox").className = "upload-status";
  selectedGradient = 0;
  renderColorPicker();
  document.getElementById("form-modal").classList.add("open");
}

function editExt(jsonStr) {
  var ext = JSON.parse(jsonStr);
  editingId = ext.id;
  document.getElementById("form-title").textContent = "Edit: " + ext.name;
  document.getElementById("f-name").value = ext.name || "";
  document.getElementById("f-version").value = ext.version || "";
  document.getElementById("f-desc").value = ext.description || "";
  document.getElementById("f-features").value = (ext.features || []).join("\n");
  document.getElementById("f-icon").value = ext.icon || "fa-solid fa-puzzle-piece";
  document.getElementById("f-tags").value = (ext.tags || []).join(", ");
  document.getElementById("f-chrome-url").value = ext.chrome_url || "";
  document.getElementById("f-firefox-url").value = ext.firefox_url || "";
  if (ext.chrome_only) document.getElementById("f-chromeonly").classList.add("on");
  else document.getElementById("f-chromeonly").classList.remove("on");
  selectedGradient = 0;
  if (ext.gradient_colors) {
    GRADIENT_PRESETS.forEach(function(g, i) {
      if (g[0] === ext.gradient_colors[0] && g[1] === ext.gradient_colors[1]) selectedGradient = i;
    });
  }
  document.getElementById("status-chrome").className = "upload-status";
  document.getElementById("status-firefox").className = "upload-status";
  renderColorPicker();
  document.getElementById("form-modal").classList.add("open");
}

function closeForm() { document.getElementById("form-modal").classList.remove("open"); }

function handleUpload(browser, file) {
  if (!file) return;
  var statusEl = document.getElementById("status-" + browser);
  var urlEl = document.getElementById("f-" + browser + "-url");
  statusEl.textContent = "Uploading " + file.name + "...";
  statusEl.className = "upload-status prog";

  var extName = document.getElementById("f-name").value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") || "extension";
  var version = document.getElementById("f-version").value.trim() || "1.0.0";
  var suffix = browser === "firefox" ? ".xpi" : ".zip";
  var filename = extName + "-" + browser + "-v" + version + suffix;

  fetch(API_URL + "/extensions/upload-url", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: filename, content_type: "application/octet-stream" })
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (!result.upload_url) throw new Error(result.error || "No upload URL returned");
    return fetch(result.upload_url, {
      method: "PUT",
      headers: { "Content-Type": "application/octet-stream" },
      body: file
    }).then(function(uploadResp) {
      if (!uploadResp.ok) throw new Error("S3 upload failed: " + uploadResp.status);
      urlEl.value = result.download_url;
      statusEl.textContent = "Uploaded: " + filename + " (" + (file.size / 1024).toFixed(1) + " KB)";
      statusEl.className = "upload-status ok";
    });
  })
  .catch(function(err) {
    statusEl.textContent = "Upload failed: " + err.message;
    statusEl.className = "upload-status err";
  });
}

// Drag and drop
["chrome","firefox"].forEach(function(browser) {
  var area = document.getElementById("upload-" + browser);
  if (!area) return;
  area.addEventListener("dragover", function(e) { e.preventDefault(); area.classList.add("dragover"); });
  area.addEventListener("dragleave", function() { area.classList.remove("dragover"); });
  area.addEventListener("drop", function(e) {
    e.preventDefault(); area.classList.remove("dragover");
    var file = e.dataTransfer.files[0];
    if (file) handleUpload(browser, file);
  });
});

function saveExt() {
  var name = document.getElementById("f-name").value.trim();
  if (!name) { toast("Name is required", false); return; }

  var features = document.getElementById("f-features").value.trim().split("\n").filter(function(l) { return l.trim(); });
  var tags = document.getElementById("f-tags").value.trim().split(",").map(function(t) { return t.trim(); }).filter(function(t) { return t; });

  var payload = {
    name: name,
    version: document.getElementById("f-version").value.trim() || "1.0.0",
    description: document.getElementById("f-desc").value.trim(),
    features: features,
    icon: document.getElementById("f-icon").value.trim() || "fa-solid fa-puzzle-piece",
    gradient_colors: GRADIENT_PRESETS[selectedGradient],
    tags: tags,
    chrome_url: document.getElementById("f-chrome-url").value.trim(),
    firefox_url: document.getElementById("f-firefox-url").value.trim(),
    chrome_only: document.getElementById("f-chromeonly").classList.contains("on"),
  };

  if (editingId) payload.id = editingId;

  fetch(API_URL + "/extensions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.success) {
      toast(editingId ? "Extension updated!" : "Extension added!", true);
      closeForm();
      loadExts();
    } else {
      toast(result.error || "Save failed", false);
    }
  })
  .catch(function(err) { toast("Error: " + err.message, false); });
}

function deleteExt(id, name) {
  if (!confirm("Delete \"" + name + "\"? This cannot be undone.")) return;
  fetch(API_URL + "/extensions/" + id, { method: "DELETE" })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.success) { toast("Deleted " + name, true); loadExts(); }
    else { toast(result.error || "Delete failed", false); }
  })
  .catch(function(err) { toast("Error: " + err.message, false); });
}

renderColorPicker();
</script>
</body>
</html>
